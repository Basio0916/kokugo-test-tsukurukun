# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  # 国語テストつくるくん（仮称。リポジトリ名は mondai-tsukurukun）

  ## 何を作るか
  日本の中学校の国語の先生が、定期テスト一式（問題用紙・解答用紙・模範解答・採点基準）を
  AI と相談しながら作る Web サービス。
  目指すのは「AI が作ったテスト」ではなく「先生が AI と作ったテスト」。AI は理由つきで案を出し、決めるのは先生。

  ## 背景
  - Anthropic の日本向けハッカソン（2026-11-02 から約1週間）。審査員は日本語を読める
  - 締め切りは 2026-11-08 20:00。提出物はデプロイした URL とデモ動画
  - ハッカソンの規定により、このリポジトリで新規に作る
  - 評価してもらう中心は「問題用紙を AI と作る体験」
  - 先生にとって大変なのは、設問を考える・傍線を引く位置を決める・選択肢を作る・作文をどこに入れるか、といった構成の判断
  - 本文は教材 CD からコピペできるので、本文の入力は困りごとではない

  ## 体験の流れ
  1. 教科書と学年を選び、テストに入れる単元を選ぶ。あわせて年度・テストの名前・満点・試験時間を入れる
     - テストの名前は学校ごとに違う（一学期／前期、中間の有無など）ので、選択式にせず自由入力にする
     - 満点（五十点・百点など）と試験時間は、作っている途中でも変えられる
  2. 選んだ単元から大問の骨組みと問題の初期案が提案され、ほぼできあがった状態から始まる
     - 配点は満点に合わせて割り振り、仕上げの段階で合計を満点ちょうどにそろえる
     - 配点は奇数でもよい。刻みは一点か〇・五点（問題数が多いテストでは〇・五点刻みも使う）
  3. 文章を扱う大問には、紙面の本文欄をクリックして本文を貼る
     - 漢文は白文を貼ると、AI が返り点と送り仮名を付けて紙面に表示する。先生が確認して直せる
  4. チャットと UI での選択操作の両方で、大問ごとに中身を詰める
     - よくある操作は UI から、それ以外は自然言語で
     - 授業で重視したことを伝えて作る入り方と、おまかせで作ってから観点を足す入り方の両方がある
     - 確定した大問もあとから直せる。直すと確定が外れ、先生がもう一度確定する
     - 設問や大問を AI に作り直してもらえる。問い文や選択肢は先生が直接書き換えることもできる
     - 本文・問い文・指示文などの入力と直接の書き換え、削除・並べ替えは紙面の上で行い、チャットは AI への相談に使う
     - 文面の直接の書き換えはポップアップで行う。大問単位では、指示文とすべての小問をまとめて直せる
     - 大問の追加・削除・並べ替えは、紙面からもチャットからもできる
     - 小問も追加・削除・並べ替えができる。紙面の小問のすき間にカーソルを合わせると「＋ 小問を追加」が出る
     - 傍線部の番号は本文の順、問の番号は並び順で、どちらもシステムが自動で振り直す
  5. 問題用紙・解答用紙・模範解答・採点基準が連動してできあがる
  相談の粒度、提案の見せ方と確定のしかたなど細かい UX は未確定。実際に動くものができたら、現役の国語の先生に触ってもらって詰める
  AI の最初の提案は文面まで出す。設計図（どこで何を問うかだけ）の段階は挟まない（先生に試してもらい決定）
  大問の本文も、あとから直せる（大問を選んで「本文を直す」）。小問との整合は「食い違いを知らせる」方式で保つ
     - 傍線は文字に付いていて、前後を直しても一緒に動く。傍線部の中を直そうとすると「ここは問◯の傍線部です」と注意を出す
     - 保存すると、システムが機械的に確かめる: 傍線部が残っているか、傍線部の文字が変わっていないか、抜き出しの答えが本文にあるか、問い文が引用している言葉が本文にあるか
     - 選択肢や模範解答の内容が本文と合っているかは、AI が確かめる
     - 食い違った小問には「要確認」の印を付け、会話で「AI に直してもらう／このままにする／小問を消す」を先生が選ぶ。勝手には直さない
     - 「このままにする」と決めた点は、次に本文を直したときにはもう知らせない
     - ルビや返り点・送り仮名が外れたら、AI が付け直す
  指示文は見出しのダブルクリックで直す。大問の指示文と小問をまとめて直す一括編集はやめた
  小問の足し方
     - 「AI のおすすめから選ぶ」と「形式を選んで AI に作ってもらう」は、先生の好みで使い分けられるよう両方残す
     - 本文に線を引いて作るのは、先生の主体性が出る場面。選択肢から選ばせず、どんな問題にしたいかを先生に自由に書いてもらい、AI が問い文の形に整えて返す。整えたところ（字数の指定など）を示し、先生はその場で直してから入れられる
     - 「自分で書く」「チャットで頼む」も残す

  ## MVP の範囲
  - 教科書: 光村図書（令和7年度版）の1〜3年
  - 大問の種類: 漢字の読み書き / 文法 / 文学的文章 / 古文 / 漢文 / 作文（説明的文章を入れるかは未定）
  - 漢文（漢詩）も入れる。返り点・送り仮名を縦書きで表示できることはモックで確かめた
  - 入力は文字のみ（職員室でも使えるように）。音声入力はしない

  ## 紙面
  - docs/reference/サンプル問題用紙.pdf と docs/reference/サンプル解答用紙.pdf を紙面の基準にする
  - 縦書きで右から左へ進む。本文は枠で囲み、末尾に出典を置く
  - 傍線は文字の右側に引き、番号（①②…）を傍線の頭に付ける
  - 大問は【一】のような見出し＋指示文＋合計点。設問は 問一＋問い文＋（配点）、選択肢は ア〜エ
  - 古文にはルビが付く。漢文は返り点を文字の左下、送り仮名を右下に置く
  - 解答用紙は、マス目を作ったうえで A3・B4 などの一枚に収める（割り付ける）品質を目指す。この割り付けはそれだけで技術的な山になる

  ## 設計の原則
  - AI は中身（論理構造）だけを扱う: 傍線部の範囲、問い文、選択肢、正答、模範解答、採点基準、観点
  - 番号（傍線部①、問一、ア〜エ）と紙面上の配置はシステムが決定的に計算する。AI に番号を持たせない
  - 問題用紙・解答用紙・模範解答・採点基準は同じテストのデータから導出し、常に連動させる
  - 観点は「知識・技能」と「思考・判断・表現」。設問ごとに観点と指導事項の記号（例: C(1)イ）を持たせ、観点別の配点を集計できるようにする
  - AI は単元の指導目標を土台に設問を提案し、指導目標から外れる設問を入れるときはそのことを先生に伝える

  ## 単元データ
  - 光村図書が公開している令和7年度版「年間指導計画例」から、単元名・教材名・月・時数・ジャンル・指導目標（指導事項の記号）を起こす
  - 一〜三年分を src/catalog/ にデータ化済み（単元・教材・月・時数・指導事項と言語活動例の記号、告示の指導事項の文言）
  - 漢詩の風景では春暁・絶句などを扱う（現役の先生に確認済み）
  - リポジトリには事実情報だけを置き、資料の文章は丸ごと入れない。指導事項の文言は学習指導要領（告示）から引く
  - 光村図書のサイトからダウンロードした資料（PDF・Word）は docs/sources/ に手元だけ置き、リポジトリには入れない

  ## 技術スタック
  - Vite + React + TypeScript。データの形は zod で定義する。テストは Vitest と Playwright
  - デプロイは Vercel。AI の呼び出しは Vercel Functions から Claude API（ハッカソンのクレジット）で行い、API キーはサーバー側だけに置く
  - 公開した URL にアクセス制限はかけない

