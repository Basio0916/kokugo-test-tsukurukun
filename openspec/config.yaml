context: |
  # 国語テストつくるくん（仮称。リポジトリ名は mondai-tsukurukun）

  ## 何を作るか
  日本の中学校の国語の先生が、定期テスト一式（問題用紙・解答用紙・模範解答・採点基準）を
  AI と相談しながら作る Web サービス。
  目指すのは「AI が作ったテスト」ではなく「先生が AI と作ったテスト」。AI は理由つきで案を出し、決めるのは先生。

  ## 背景
  - Anthropic の日本向けハッカソン（2026-11-02 から約1週間）。審査員は日本語を読める
  - ハッカソンの規定により、このリポジトリで新規に作る
  - 評価してもらう中心は「問題用紙を AI と作る体験」
  - 先生にとって大変なのは、設問を考える・傍線を引く位置を決める・選択肢を作る・作文をどこに入れるか、といった構成の判断
  - 本文は教材 CD からコピペできるので、本文の入力は困りごとではない

  ## 体験の流れ
  1. 教科書と学年を選び、テストに入れる単元を選ぶ
  2. 選んだ単元から大問の骨組みと問題の初期案が提案され、ほぼできあがった状態から始まる
  3. 文章を扱う大問には本文を貼る
  4. チャットと UI での選択操作の両方で、大問ごとに中身を詰める
     - よくある操作は UI から、それ以外は自然言語で
     - 授業で重視したことを伝えて作る入り方と、おまかせで作ってから観点を足す入り方の両方がある
  5. 問題用紙・解答用紙・模範解答・採点基準が連動してできあがる
  相談の粒度、提案の見せ方と確定のしかたなど細かい UX は未確定。モックを現役の国語の先生に見せて決める

  ## MVP の範囲
  - 教科書: 光村図書（令和7年度版）の1〜3年
  - 大問の種類: 漢字の読み書き / 文法 / 文学的文章 / 古文 / 作文（説明的文章を入れるかは未定）
  - 漢文は対象外（返り点の組版が重いため）
  - 入力は文字のみ（職員室でも使えるように）。音声入力はしない

  ## 紙面
  - docs/reference/サンプル問題用紙.pdf と docs/reference/サンプル解答用紙.pdf を紙面の基準にする
  - 縦書きで右から左へ進む。本文は枠で囲み、末尾に出典を置く
  - 傍線は文字の右側に引き、番号（①②…）を傍線の頭に付ける
  - 大問は【一】のような見出し＋指示文＋合計点。設問は 問一＋問い文＋（配点）、選択肢は ア〜エ
  - 古文にはルビが付く

  ## 設計の原則
  - AI は中身（論理構造）だけを扱う: 傍線部の範囲、問い文、選択肢、正答、模範解答、採点基準、観点
  - 番号（傍線部①、問一、ア〜エ）と紙面上の配置はシステムが決定的に計算する。AI に番号を持たせない
  - 問題用紙・解答用紙・模範解答・採点基準は同じテストのデータから導出し、常に連動させる
  - 観点は「知識・技能」と「思考・判断・表現」。設問ごとに持たせ、観点別の配点を集計できるようにする

  ## 単元データ
  - 光村図書が公開している令和7年度版「年間指導計画例」から、単元名・教材名・ジャンル・指導事項の記号を起こす
  - リポジトリには事実情報だけを置き、資料の文章は丸ごと入れない。指導事項の文言は学習指導要領（告示）から引く

  ## 技術スタック
  未定

