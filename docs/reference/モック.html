<title>国語テストつくるくん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 会話（左）で相談し、紙面（右）が育っていく二画面。紙面は印刷物なのでどちらのテーマでも白地に墨色 */
:root{
  --bg:#E8EBF0; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#1B2130; --muted:#5A6375; --line:#D2D8E1;
  --accent:#2C4A8C; --accent-ink:#FFFFFF; --accent-soft:#E2E8F6;
  --kanten-k:#2C4A8C; --kanten-s:#2F7D77;
  --ok:#2D7A4F; --ok-soft:#E0F0E6; --warn:#995A00; --warn-soft:#F8EAD3; --danger:#A3322B;
  --note-bg:#FFF7DF; --note-line:#E6D29C; --note-ink:#5A4512;
  --paper:#FFFFFF; --paper-ink:#141414; --paper-ghost:#2C4A8C; --paper-ghost-bg:rgba(44,74,140,.07); --paper-flash:rgba(255,206,84,.55); --paper-sub:#EAEAEA;
  --paper-shadow:0 1px 2px rgba(20,30,50,.14),0 10px 28px rgba(20,30,50,.10);
  --font-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --font-paper:"BIZ UDMincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141A; --surface:#1A1E26; --surface-2:#232934; --ink:#E5E9F0; --muted:#9AA4B5; --line:#2F3642;
    --accent:#93ABEB; --accent-ink:#0E1424; --accent-soft:#26314B;
    --kanten-k:#93ABEB; --kanten-s:#6FC3BA;
    --ok:#7CC79A; --ok-soft:#1D3327; --warn:#E3B062; --warn-soft:#3A2D18; --danger:#F09A92;
    --note-bg:#2E2817; --note-line:#4E4325; --note-ink:#EED9A3;
    --paper-shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#1A1E26; --surface-2:#232934; --ink:#E5E9F0; --muted:#9AA4B5; --line:#2F3642;
  --accent:#93ABEB; --accent-ink:#0E1424; --accent-soft:#26314B;
  --kanten-k:#93ABEB; --kanten-s:#6FC3BA;
  --ok:#7CC79A; --ok-soft:#1D3327; --warn:#E3B062; --warn-soft:#3A2D18; --danger:#F09A92;
  --note-bg:#2E2817; --note-line:#4E4325; --note-ink:#EED9A3;
  --paper-shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.6}
button,select,textarea,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{flex:none;display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--accent);color:var(--accent);font-family:var(--font-paper);font-weight:700;font-size:16px;border-radius:4px}
.brand b{font-size:16px;letter-spacing:.04em}
.badge{flex:none;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;line-height:1.3;text-align:left}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{padding:12px 16px;font-size:15px;width:100%;text-align:center}
.banner{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.main{flex:1;min-height:0;overflow:auto}

/* 範囲選択 */
.scope{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:14px;align-items:start;max-width:1120px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.h1{font-size:20px;margin:0 0 4px;text-wrap:balance}
.h2{font-size:15px;margin:0 0 10px}
.h3{font-size:13px;margin:16px 0 8px}
.lead{margin:0 0 14px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field select,.field input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;color:var(--ink);min-width:0;width:100%}
.field .unit-in{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ug{border:1px solid var(--line);border-radius:10px;padding:6px 12px 8px;margin:0;min-width:0}
.ug legend{font-size:12px;color:var(--muted);padding:0 4px;font-weight:700}
.unit{display:flex;align-items:flex-start;gap:8px;padding:5px 0;cursor:pointer}
.unit input{margin-top:4px;accent-color:var(--accent);flex:none}
.unit .u-b{display:flex;flex-direction:column;min-width:0}
.unit .u-meta{font-size:11.5px;color:var(--muted)}
.unit .u-code{font-size:11px;color:var(--accent);font-weight:700}
.unit.na .u-name{color:var(--muted)}
.fine{font-size:12px;color:var(--muted);margin:12px 0 0}
.toast{margin:10px 0 0;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.skel{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.skel li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;background:var(--surface-2);border-radius:8px}
.skel .n{font-family:var(--font-paper);font-weight:700;flex:none}
.skel .k{margin-left:auto;font-size:11px;color:var(--muted);flex:none}
.skel .empty{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.goals{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.goals .g-u{font-weight:700;margin:0}
.goals ul{margin:2px 0 0;padding-left:1.1em}
.goals li{margin:2px 0}
.g-k{font-weight:700;white-space:nowrap}
.g-k.k{color:var(--kanten-k)}.g-k.s{color:var(--kanten-s)}

/* エディタ */
.editor{height:100%;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:12px}
.mview{display:none;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.mview button{flex:1;border:0;background:transparent;padding:8px;cursor:pointer;position:relative}
.mview button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.mview .dot{position:absolute;top:7px;margin-left:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chat-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chat-h b{font-size:14px;margin-right:auto}
.ctx{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 4px 3px 10px;font-weight:700}
.ctx button{border:0;background:transparent;cursor:pointer;color:inherit;width:20px;height:20px;border-radius:50%;line-height:1}
.msgs{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .who{flex:none;width:26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:grid;place-items:center}
.msg .body{min-width:0;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.msg .body p{margin:0}
.msg.me{justify-content:flex-end}
.msg.me .body{background:var(--accent);color:var(--accent-ink);max-width:88%}
.msg .warn{color:var(--warn);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.notes{background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-ink);border-radius:8px;padding:8px 10px;font-size:12.5px}
.notes p{font-weight:700;margin:0 0 2px}
.notes ul{margin:0;padding-left:1.2em}
.mini{margin:0;padding-left:1.3em}
.typing .dots{display:inline-flex;gap:4px;padding:4px 0}
.typing .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing .dots i:nth-child(2){animation-delay:.15s}.typing .dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;max-height:60%;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.sug{border-style:dashed;color:var(--accent)}
.chip.danger{color:var(--danger)}
.chips-label{font-size:11px;color:var(--muted);width:100%}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:14px;line-height:1.5}
.hint{font-size:11px;color:var(--muted);margin:0}

.paper-area{position:relative;min-width:0;min-height:0;overflow:auto;border-radius:12px}
.ptools{position:sticky;top:0;left:0;z-index:3;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.ptools-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:transparent;padding:7px 12px;font-size:13px;cursor:pointer}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.settings label{display:inline-flex;align-items:center;gap:4px}
.settings input,.settings select{width:74px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.settings select{width:auto}
.meter{display:flex;flex-direction:column;gap:4px;min-width:220px;flex:1;max-width:420px}
.mt-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.mt-bar span{transition:flex .4s}
.mt-k{background:var(--kanten-k)}.mt-s{background:var(--kanten-s)}
.mt-nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mt-nums b{color:var(--ink)}
.mt-nums .off b{color:var(--warn)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.sw.k{background:var(--kanten-k)}.sw.s{background:var(--kanten-s)}
.mt-t{margin-left:auto}
.outline{display:flex;flex-wrap:wrap;gap:6px}
.oc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.oc b{font-family:var(--font-paper)}
.oc.add{border-style:dashed;color:var(--accent);font-weight:700}
.oc .st{font-size:11px;border-radius:999px;padding:0 6px}
.oc .st-fixed{background:var(--ok-soft);color:var(--ok)}
.oc .st-prop{background:var(--accent-soft);color:var(--accent)}
.oc .st-wait{background:var(--surface-2);color:var(--muted)}
.selbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 10px}
.selbar .btn{padding:4px 10px;font-size:12px}
.selbar .muted{font-size:11px}
.selbar .btn.danger{color:var(--danger)}
.selbar .chk-note{color:var(--warn);font-weight:700}
.oc .st-warn{background:var(--warn-soft);color:var(--warn)}
/* 本文を直す欄。傍線部は色を付けて見せ、文字と一緒に動く */
.pe{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);color:var(--ink);font-family:var(--font-paper);font-size:15px;line-height:2.1;min-height:8em;white-space:pre-wrap;outline:none}
.pe:focus{border-color:var(--accent)}
.pe-m{background:var(--accent-soft);border-bottom:2px solid var(--accent);border-radius:2px}
.pe-m::before{content:attr(data-label);font-family:var(--font-ui);font-size:.68em;font-weight:700;color:var(--accent);margin-right:2px;user-select:none}
.pe-warn{margin:0;padding:6px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:700}
/* 紙面で直接入力・編集するためのポップアップ */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(14,19,30,.45);display:flex;align-items:center;justify-content:center;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(10,15,30,.3);width:100%;max-width:760px;max-height:100%;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.modal-h{margin:0;font-weight:700;font-size:15px}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.modal textarea,.modal input,.modal select{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink);font-size:14px}
.modal textarea{font-family:var(--font-paper);line-height:1.7;resize:vertical}
.mq{border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.mq legend{font-family:var(--font-paper);font-weight:700;padding:0 4px}
.pp-note{margin:0;font-size:12px;color:var(--muted)}
.mtabs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.mtabs button{border:0;background:var(--surface);padding:7px 12px;font-size:13px;cursor:pointer}
.mtabs button+button{border-left:1px solid var(--line)}
.mtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cands{display:flex;flex-direction:column;gap:8px}
.cand{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.cand-h{margin:0;font-weight:700}
.cand-s{margin:0;font-family:var(--font-paper);font-size:13.5px}
.cand-m{margin:0;font-size:12px;color:var(--muted)}
.cand .btn{align-self:flex-start}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.formgrid .btn{display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.formgrid small{font-size:11px;color:var(--muted)}
.own-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.markbtn{position:fixed;z-index:40;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;padding:8px 14px;box-shadow:0 6px 18px rgba(10,15,30,.25);cursor:pointer}
@media (max-width:560px){.formgrid,.own-row{grid-template-columns:minmax(0,1fr)}}

/* 紙面 */
.pages{display:flex;flex-direction:column;gap:18px;padding:2px 2px 28px}
.page-wrap{position:relative;flex:none;margin-inline:auto;width:calc(1092px*var(--s,1));height:calc(772px*var(--s,1))}
.page{position:absolute;left:0;top:0;width:1092px;height:772px;transform:scale(var(--s,1));transform-origin:0 0;background:var(--paper);color:var(--paper-ink);box-shadow:var(--paper-shadow);font-family:var(--font-paper)}
.page-no{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:#777}
.pin{position:absolute;inset:44px 46px 50px 46px;writing-mode:vertical-rl;font-size:14px;line-height:1.82;overflow:hidden}
.pin p{margin:0}
.cover .c-term{font-size:.92em}
.cover .c-title{font-size:2em;font-weight:700;letter-spacing:.6em;margin-block:.25em .15em}
.cover .c-notes{font-size:.78em;margin-block-start:.6em}
.rule{block-size:0;border-block-end:1px solid var(--paper-ink);margin-block:0 1.1em}
.sec{margin-block-end:1.3em}
.sec-h{margin-block-end:.4em;border-radius:3px}
.sec-h.clickable-h{cursor:pointer}
.sec-h.clickable-h:hover{background:var(--paper-ghost-bg)}
.sec.sel-sec>.sec-h{outline:2px solid var(--paper-ghost);outline-offset:2px;background:var(--paper-ghost-bg)}
.sec-h b,.ql{font-weight:700}
.pt{font-size:.72em}
.passage{border:1px solid var(--paper-ink);padding:1em .9em;margin-block:.3em 1em}
.passage p{text-indent:1em}
.passage .src{text-indent:0;text-align:end;font-size:.78em;margin-block-start:.8em}
.bs{border-right:1px solid currentColor;padding-right:1px}
.kt{font-weight:700}
.mk{font-size:.92em}
.gh{border-right:1.5px dashed var(--paper-ghost);background:var(--paper-ghost-bg)}
.kanshi{padding:1.2em 1.4em}
.kanshi p{text-indent:0}
.ks-title{font-weight:700;margin-block-end:.6em}
.ks-title span{font-weight:400;padding-inline-start:4em}
.ks-line{font-size:1.18em;line-height:2.7;padding-inline-start:2em}
.kc{position:relative;display:inline-block;line-height:1}
.kc .ok{position:absolute;top:52%;right:-54%;font-size:.48em;line-height:1.02;writing-mode:vertical-rl;white-space:nowrap}
.kc .kten{position:absolute;top:60%;left:-48%;font-size:.48em;line-height:1}
.kanshi .bs{padding-right:.75em}
.ks-notes{font-size:.78em;margin-block-start:1em}
.q{border-radius:3px}
.addq{block-size:1.15em;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:3px;font-family:var(--font-ui);font-size:.72em;color:transparent;white-space:nowrap}
.addq:hover,.addq:focus-visible{color:var(--paper-ghost);background:var(--paper-ghost-bg);outline:1px dashed var(--paper-ghost)}
@media (hover:none){.addq{color:rgba(44,74,140,.5)}}
.q.clickable{cursor:pointer}
.q.clickable:hover{background:var(--paper-ghost-bg)}
.q.sel{outline:2px solid var(--paper-ghost);outline-offset:2px;background:var(--paper-ghost-bg)}
.q.needs-check{outline:1.5px dashed #C98A1B;outline-offset:2px}
.chk{font-family:var(--font-ui);font-size:.68em;font-weight:700;background:#FBE6BE;color:#7A4A00;border:1px solid #E0B460;border-radius:3px;padding:.15em .1em;margin-block-end:.3em}
.proposed .q{color:var(--paper-ghost)}
.cond{padding-inline-start:1em}
.placeholder{border:1.5px dashed #9AA3B5;color:#6B7385;padding:1em;margin-block:.3em 1em;display:flex;flex-direction:column;gap:.4em;font-family:var(--font-ui);inline-size:60%}
.placeholder .ph-sub{font-size:.8em}
.placeholder.ph-click{cursor:pointer}
.placeholder.ph-click:hover{border-color:var(--paper-ghost);color:var(--paper-ghost);background:var(--paper-ghost-bg)}
.custom-note{font-family:var(--font-ui);color:#8a6200}
.end{margin-block-start:1.5em;font-size:.85em}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--paper-flash)}to{background:transparent}}

/* 解答用紙 */
.as{position:absolute;inset:34px 30px 40px 30px;display:flex;flex-direction:row-reverse;align-items:flex-start;gap:8px;--c:18px;font-size:10px;line-height:1.25}
.as-title{writing-mode:vertical-rl;font-size:16px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.as-side{display:flex;flex-direction:column;gap:8px;width:50px}
.as-name{writing-mode:vertical-rl;border:1px solid currentColor;height:380px;display:flex;justify-content:space-around;align-items:center;font-size:13px;padding:6px 0}
.as-kan{border:1px solid currentColor}
.as-kan div{display:flex;flex-direction:column;padding:3px 4px;font-size:10px}
.as-kan div+div{border-top:1px solid currentColor}
.as-kan b{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.as-sec{border:1px solid currentColor;display:flex;flex-direction:column}
.as-prop{border-style:dashed;color:var(--paper-ghost)}
.as-sh{text-align:center;padding:2px 0;border-bottom:1px solid currentColor;font-size:12px}
.as-sb{display:flex;flex-direction:row-reverse;align-items:flex-start}
.as-q{display:flex;flex-direction:column}
.as-q+.as-q{border-right:1px solid currentColor}
.as-qh{text-align:center;background:var(--paper-sub);border-bottom:1px solid currentColor;padding:2px 0;white-space:nowrap;font-size:8.5px;letter-spacing:-.08em}
.as-its{display:flex;flex-direction:row-reverse}
.as-it{display:flex;flex-direction:column}
.as-it+.as-it{border-right:1px solid currentColor}
.as-ih{text-align:center;border-bottom:1px solid currentColor;font-size:9.5px;padding:1px 0}
.as-box{width:var(--c)}
.as-grid{display:flex;flex-direction:row-reverse}
.as-col{display:flex;flex-direction:column}
.as-col+.as-col{border-right:1px solid currentColor}
.as-cell{width:var(--c);height:var(--c);border-bottom:1px dotted #9a9a9a}
.as-cell:last-child{border-bottom:0}
.as-score{border-top:1px solid currentColor;text-align:right;padding:1px 4px;background:var(--paper-sub);font-variant-numeric:tabular-nums}
.as-wait{writing-mode:vertical-rl;padding:8px 4px;color:#777;font-family:var(--font-ui)}

/* 模範解答・採点基準 */
.mohan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.mohan table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}
.mohan th,.mohan td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.mohan th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.mohan .grp td{background:var(--surface-2);font-weight:700;font-family:var(--font-paper)}
.mohan .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mohan ul{margin:0;padding-left:1.1em}
.mohan .ans{font-family:var(--font-paper)}
.mohan tfoot td{font-weight:700;border-bottom:0}
.mohan small{display:block;color:var(--muted);font-weight:400}
.kt-k{color:var(--kanten-k);font-weight:700;white-space:nowrap}.kt-s{color:var(--kanten-s);font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}

@media (max-width:899px){
  .editor{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .mview{display:flex}
  .editor[data-view="chat"] .paper-area{display:none}
  .editor[data-view="paper"] .chat{display:none}
  .scope{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .fields,.units{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .flash,.typing .dots i{animation:none}
  .mt-bar span{transition:none}
}

const quoteOf = text => text.length > 12 ? `${text.slice(0, 5)}〜${text.slice(-3)}` : text;
function numOf(s) {
  if (/^[0-9０-９]+$/.test(s)) return +s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let n = 0, cur = 0;
  for (const ch of s) { const d = KD.indexOf(ch); if (d >= 0) cur = d; else if (ch === '十') { n += (cur || 1) * 10; cur = 0; } else if (ch === '百') { n += (cur || 1) * 100; cur = 0; } }
  return n + cur;
}

  let lim = forceLim || (limM ? numOf(limM[1]) : 0);
  const form = forceForm || (/抜き出/.test(w) ? 'extract' : /選択|記号|選ば|選ぶ/.test(w) ? 'choice' : 'desc');
  const kind = /表現|効果|工夫|比喩|たとえ|書き方|書いたのか/.test(w) ? 'expr' : /なぜ|理由|わけ/.test(w) ? 'reason' : /気持ち|心情|思い|心の/.test(w) ? 'feeling'
    : /人物|人柄|どんな人|性格/.test(w) ? 'character' : /指す|指して|指示/.test(w) ? 'point' : /意味|どういうこと/.test(w) ? 'meaning' : 'other';
  const who = sec.id === 'meros' ? 'メロス' : '登場人物';
  const head = {
    reason: `傍線部「${quote}」とありますが、それはなぜですか。`, feeling: `傍線部「${quote}」とありますが、このときの${who}の気持ちはどのようなものですか。`,
    character: `傍線部「${quote}」から、${who}はどのような人物だと読み取れますか。`, expr: `傍線部「${quote}」という表現には、どのような効果がありますか。`,
    point: `傍線部「${quote}」が指している内容は何ですか。`, meaning: `傍線部「${quote}」とは、どういうことですか。`, other: `傍線部「${quote}」とは、どういうことですか。`,
  }[kind];
  if (form !== 'choice' && !lim) lim = form === 'extract' ? 15 : 30;
  const tail = form === 'extract' ? `本文中から${kan(lim)}字以内で抜き出しなさい。` : form === 'choice' ? '最も適切なものを、次のア〜エから一つ選び、記号で答えなさい。' : `本文中の言葉を使って、${kan(lim)}字以内で書きなさい。`;
  const kanten = kind === 'meaning' && form === 'choice' ? 'k' : 's';
  const goals = GOALS[sec.id] || [];
  const goal = goals.find(g => g[0] === kanten);
  const code = kind === 'expr' ? 'C(1)エ' : goal ? goal[1] : kanten === 'k' ? '(1)エ' : 'C(1)イ';
  const short = want.length > 24 ? want.slice(0, 22) + '…' : want;
  const notes = [`先生の「${esc(short)}」を、生徒が答える形の問い文にしました。`];
  if (kind === 'other') notes.push('何を問いたいかを読み取りきれなかったので、「どういうことか」を問う形にしています。違っていたら書き直してください。');
  if (form !== 'choice' && !limM && !forceLim) notes.push(`答えの長さがそろうよう、「${kan(lim)}字以内」と字数を指定しました。`);
  if (form === 'desc') notes.push('答えの根拠を本文から探せるよう、「本文中の言葉を使って」を入れました。');
  if (form === 'choice') notes.push('選択肢は、本文をもとに AI が作ります（モックではひな形です）。');
  if (kind === 'expr' && !goals.some(g => g[1] === 'C(1)エ')) notes.push('表現の効果（C(1)エ）は、この単元の指導目標には入っていません。');
  notes.push('模範解答と採点基準も、あわせて作ります（モックでは省略）。');
  const what = { reason: '理由', feeling: '気持ち', character: '人物像', expr: '表現の効果', point: '指している内容', meaning: '意味', other: '内容の理解' }[kind];
  const plan = what + (form === 'choice' ? '（選択）' : form === 'extract' ? `（抜き出し・${kan(lim)}字以内）` : `（記述・${kan(lim)}字以内）`);
  return { form, lim, stem: head + tail, kanten, code, points: snap((form === 'desc' ? 6 : 4) * state.f), plan, notes };

const qPts = q => q.perItem ? q.perItem * q.items.length : q.points;
const sPts = s => s.questions.reduce((a, q) => a + qPts(q), 0);
function totals() {
  let k = 0, s = 0;
  for (const sec of state.sections) for (const q of sec.questions) { if (q.kanten === 'k') k += qPts(q); else s += qPts(q); }
  return { k, s, t: k + s };
}
const ptsLabel = q => q.perItem ? `各${kanPt(q.perItem)}点` : `${kanPt(q.points)}点`;
const snap = (x, step = state.step) => Math.max(step, Math.round(x / step) * step);
function scaleQ(q, f = state.f) {
  if (q.perItem) q.perItem = snap(q.perItem * f); else q.points = snap(q.points * f);
  return q;
}
const complete = () => state.sakubunOffered && !state.sections.some(s => s.stage === 'empty');
function rescale(target, skip = []) {
  const step = state.step;
  const qs = [];
  state.sections.forEach(s => { if (!skip.includes(s.id) && s.stage !== 'empty') qs.push(...s.questions); });
  const cur = qs.reduce((a, q) => a + qPts(q), 0);
  if (!cur || cur === target) return;
  const before = new Map(qs.map(q => [q, qPts(q)]));
  const r = target / cur;
  qs.forEach(q => { if (q.perItem) q.perItem = snap(q.perItem * r, step); else q.points = snap(q.points * r, step); });
  let d = target - qs.reduce((a, q) => a + qPts(q), 0);
  const singles = qs.filter(q => !q.perItem).sort((a, b) => b.points - a.points);
  for (let i = 0; Math.abs(d) >= step / 2 && singles.length && i < 2000; i++) {
    const q = singles[i % singles.length];
    if (d > 0) { q.points += step; d -= step; } else if (q.points > step) { q.points -= step; d += step; }
  }
  qs.forEach(q => { if (qPts(q) !== before.get(q)) q.flash = true; });
}

// 傍線は、どれかの設問が参照しているものだけを、本文の順に①②…と数える
function refsOf(q) {
  const ids = [];
  [q.stem, q.planRef].forEach(t => t && [...t.matchAll(/\{(?:n:)?(m\d)\}/g)].forEach(m => ids.push(m[1])));
  if (q.mark) ids.push(q.mark);
  if (q.items) q.items.forEach(it => it.ref && ids.push(it.ref));
  return [...new Set(ids)];
}
function usedMarks(sec) { return new Set(sec.questions.flatMap(refsOf)); }
function markIds(sec) { const used = usedMarks(sec); return [...passageText(sec).matchAll(/<m(\d)>/g)].map(x => 'm' + x[1]).filter(m => used.has(m)); }
function markPosOf(sec, q) {

}

function tokenize(text, ids, q) {
  let t = text.replace(/傍線部([①-⑨])|([①-⑨])(?=「)/g, (all, a, b) => { const id = ids[(a || b).charCodeAt(0) - 0x2460]; return id ? (a ? `{${id}}` : `{n:${id}}`) : all; });
  if (q && q.choices) t = t.replace(`ア〜${KANA[q.choices.length - 1]}`, '{range}');

}

function fill(t, sec, q) {

    .replace('{range}', q && q.choices ? `ア〜${KANA[q.choices.length - 1]}` : '');
}

function qLabel(sec, q) { return sec.kind === 'sakubun' ? '作文' : `問${kan(sec.questions.indexOf(q) + 1)}`; }

function itemText(t, q) { return t.replace(/\[\[(.+?)\]\]/g, (_, w) => `<span class="bs${q.katakana ? ' kt' : ''}">${w}</span>`); }
function kanbunHTML(s) {
  let out = '', i = 0;
  while (i < s.length) {
    if (s[i] === '<') { const j = s.indexOf('>', i); out += s.slice(i, j + 1); i = j + 1; continue; }
    const c = s[i++]; let ok = '', kt = '';
    if (s[i] === '(') { const j = s.indexOf(')', i); ok = s.slice(i + 1, j); i = j + 1; }
    if (s[i] === '[') { const j = s.indexOf(']', i); kt = s.slice(i + 1, j); i = j + 1; }
    const gap = Math.max(.55, ok.length * .5 - .2);
    out += `<span class="kc" style="margin-inline-end:${gap}em">${c}${ok ? `<span class="ok">${ok}</span>` : ''}${kt ? `<span class="kten">${kt}</span>` : ''}</span>`;
  }
  return out;
}
function markWrap(sec, t, ghost) {
  const used = usedMarks(sec);
  return t.replace(/<m(\d)>(.*?)<\/m\1>/g, (_, n, inner) => used.has('m' + n) ? `<span class="mk">${circ(markNum(sec, 'm' + n))}</span><span class="bs${ghost ? ' gh' : ''}">${inner}</span>` : inner);
}
function plainOf(d) {

}
const norm = s => s.replace(/\s/g, '');
function passageHTML(sec) {

function asQ(sec, q, qi) {
  const box = (n, label) => `<div class="as-it">${label ? `<div class="as-ih">${label}</div>` : ''}<div class="as-box" style="height:calc(var(--c) * ${n})"></div></div>`;

  };
  let body = '';
  switch (q.type) {
    case 'kanji': body = q.items.map((_, i) => box(4, circ(i + 1))).join(''); break;
    case 'choice': body = q.items ? q.items.map((_, i) => box(2, circ(i + 1))).join('') : box(2); break;
    case 'form': case 'term': body = q.items.map((_, i) => box(3, circ(i + 1))).join(''); break;

  for (let k = at; k < at + text.length; k++) {

  state.full = Math.min(200, Math.max(10, Math.round(+$('#f-full').value || 100)));
  state.time = Math.min(120, Math.max(10, Math.round(+$('#f-time').value || 50)));
  state.step = +$('#f-step').value === .5 ? .5 : 1;
  const base = SUPPORTED.filter(id => state.units.has(id)).reduce((a, id) => a + BASE[id], 0) + BASE.sakubun;
  state.f = state.full / base;
}
async function startEditor() {
  readScope();
  state.screen = 'editor';
  state.sections = SUPPORTED.filter(id => state.units.has(id)).map(newSection);
  renderEditor();
  await run(async () => {
    const list = state.sections.map((s, i) => `<li>大問${kan(i + 1)}　${s.outline}</li>`).join('');
    const fixed = state.sections.filter(s => s.status === 'fixed').map(s => s.kind === 'kanji' ? '漢字' : '文法');
    await ai(`光村図書　二年「${esc(state.term)}」の範囲から、骨組みを作りました。配点は満点の${kan(state.full)}点に収まるように割り振ります。<ol class="mini">${list}</ol>`);
    const n = nextPrompt();
    await ai(`${fixed.length ? `${fixed.join('と')}は、選んだ単元の指導目標に合わせて問題を入れてあります。紙面の大問の見出しや設問をクリックすると、私に相談できます。ダブルクリックすると、紙面で直接書き換えられます。<br>` : ''}${n.html}`, { actions: n.actions });
  });
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#reset')) { resetAll(); return; }
  if (t.closest('#build')) { startEditor(); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const m = state.chat[+act.dataset.msg]; if (!m || m.used || state.busy) return;
    const a = m.actions[+act.dataset.act];
    if (!a.keep) m.used = true;
    if (!a.silent) me(a.echo || a.label);
    run(() => ACTIONS[a.fn](a.arg));
    return;
  }
  const quickBtn = t.closest('[data-quick]');
  if (quickBtn && state.selected && !state.busy) { me(quickBtn.textContent); run(() => quick(quickBtn.dataset.quick)); return; }
  // ポップアップ
  if (t.id === 'modal') { closeModal(); return; }
  if (t.closest('#pp-save')) { if (!state.busy) run(saveEdit); return; }
  if (t.closest('#pp-cancel')) { closeModal(); return; }
  const addtab = t.closest('[data-addtab]');
  if (addtab && state.modal) { state.modal.tab = addtab.dataset.addtab; renderModal(); return; }
  const cand = t.closest('[data-addcand]');
  if (cand && state.modal && !state.busy) { const { s, at } = state.modal; me('（紙面から小問を追加しました）'); run(() => addCand(s, cand.dataset.addcand, at)); return; }
  const form = t.closest('[data-addform]');
  if (form && state.modal && !state.busy) {
    const { s, at } = state.modal; const c = availCands(S(s)).find(x => x.form === form.dataset.addform);
    if (c) { me(`（紙面から「${form.firstChild.textContent}」を頼みました）`); run(() => addCand(s, c.cid, at)); }
    return;
  }
  if (t.closest('#ao-add')) { if (state.modal && !state.busy) { const { s, at } = state.modal; run(() => addOwn(s, at)); } return; }
  if (t.closest('#mk-refine')) {
    const m = state.modal, want = $('#mk-want').value.trim();
    if (!want) { $('#mk-want').focus(); return; }
    Object.assign(m, { want, step: 'review', draft: refineWant(S(m.s), m.text, want) });
    renderModal(); return;
  }
  if (t.closest('#mk-back')) { state.modal.step = 'ask'; renderModal(); return; }
  if (t.closest('#mk-insert')) {
    const m = state.modal; if (!m || state.busy) return;
    const d = Object.assign({}, m.draft, { stem: $('#mk-stem').value.trim() || m.draft.stem, points: snap(+$('#mk-pts').value || m.draft.points), kanten: $('#mk-kt').value });
    run(() => createMarkQ(m.s, m.text, m.want, d)); return;
  }
  if (t.closest('#markbtn')) {
    const d = state.markDraft; $('#markbtn').hidden = true;
    if (d) { getSelection().removeAllRanges(); openModal({ type: 'mark', s: d.s, text: d.text }); }
    return;
  }
  // 紙面の操作
  const ph = t.closest('[data-pp]');
  if (ph) { openModal({ type: 'passage', s: ph.dataset.pp }); return; }
  const addq = t.closest('[data-addq]');
  if (addq) { openModal({ type: 'add', s: addq.dataset.addq, at: +addq.dataset.at, tab: 'rec' }); return; }
  const sb = t.closest('[data-sb]');
  if (sb) {
    const sec = selSec(), q = selQ(), k = sb.dataset.sb;
    if (!sec || state.busy) return;
    if (k === 'editq') openModal({ type: 'q', s: sec.id, q: q.id });
    else if (k === 'ptext') openModal({ type: 'ptext', s: sec.id });
    else if (k === 'addq') openModal({ type: 'add', s: sec.id, at: sec.questions.length, tab: 'rec' });
    else if (k === 'ask') { if (matchMedia('(max-width: 899px)').matches) { state.view = 'chat'; syncView(); } $('#inp').focus(); }
    else run(() => k === 'qup' ? doMoveQ(sec.id, q.id, -1) : k === 'qdown' ? doMoveQ(sec.id, q.id, 1) : k === 'qdel' ? doDeleteQ(sec.id, q.id)
      : k === 'sup' ? doMove(sec.id, -1) : k === 'sdown' ? doMove(sec.id, 1) : doDelete(sec.id));
    return;
  }
  const sug = t.closest('[data-sug]');
  if (sug) { const inp = $('#inp'); inp.value = state.sugs[+sug.dataset.sug]; inp.focus(); return; }
  if (t.closest('#send')) { send(); return; }
  if (t.closest('#unsel')) { state.selected = null; renderComposer(); renderPaper(); return; }
  if (t.closest('#add-sec')) { if (!state.busy) { me('大問を追加したい'); run(() => ACTIONS.addMenu()); } return; }
  const tab = t.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderPaper(false); $('#parea').scrollTop = 0; return; }
  const v = t.closest('.mview [data-view]');
  if (v) { state.view = v.dataset.view; syncView(); return; }
  const go = t.closest('[data-goto]');
  if (go) { focusSec(go.dataset.goto); return; }
  const sh = t.closest('[data-sh]');
  const q = t.closest('.q.clickable');
  if ((sh || q) && e.detail < 2) {
    const sid = sh ? sh.dataset.sh : q.dataset.s, qid = sh ? null : q.dataset.q;
    state.selected = isSel(sid, qid) ? null : { s: sid, q: qid };
    renderPaper(); renderComposer();
  }
});
// ダブルクリックで、紙面の問い文・指示文をその場で書き換える
document.addEventListener('dblclick', e => {
  const sh = e.target.closest('[data-sh]'), q = e.target.closest('.q.clickable');
  if (!sh && !q) return;
  const sid = sh ? sh.dataset.sh : q.dataset.s;
  if (S(sid).stage === 'empty') return;
  getSelection().removeAllRanges(); $('#markbtn').hidden = true;
  state.selected = { s: sid, q: sh ? null : q.dataset.q };
  renderPaper(); renderComposer();
  openModal(sh ? { type: 'sec', s: sid } : { type: 'q', s: sid, q: q.dataset.q });
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'inp' && e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); send(); }
  if (e.key === 'Escape' && state.modal) { closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && ['clickable', 'clickable-h', 'ph-click', 'addq'].some(c => e.target.classList.contains(c))) { e.preventDefault(); e.target.click(); }
});
// 本文を直す欄で、カーソルが傍線部に入ったら注意を出す
document.addEventListener('selectionchange', () => { if (state.modal && state.modal.type === 'ptext') onEditorCaret(); });
// 本文をドラッグして選ぶと「傍線を引いて小問を作る」を出す
document.addEventListener('mouseup', onSelectText);
document.addEventListener('touchend', e => setTimeout(() => onSelectText(e), 60));
document.addEventListener('change', e => {
  const tg = e.target;
  // 線を引いて作る小問：形式や字数を変えたら、問い文を整え直す
  if ((tg.id === 'mk-form' || tg.id === 'mk-lim') && state.modal && state.modal.type === 'mark') {
    const m = state.modal, form = $('#mk-form').value;
    const lim = form === 'choice' ? 0 : Math.round(+$('#mk-lim').value || 0);
    m.draft = Object.assign(refineWant(S(m.s), m.text, m.want, form, lim), { points: snap(+$('#mk-pts').value || m.draft.points), kanten: $('#mk-kt').value });
    renderModal(); return;
  }
  if (tg.id === 'e-full' || tg.id === 'e-time' || tg.id === 'e-step') { if (!state.busy) changeSetting(tg.id === 'e-full' ? 'full' : tg.id === 'e-time' ? 'time' : 'step', tg.value); return; }
  const u = tg.dataset && tg.dataset.unit;
  if (!u) return;
  const unit = UNITS.flatMap(g => g.items).find(x => x.id === u);
  if (unit && !unit.ok) {
    tg.checked = false;
    const toast = $('#scope-toast');
    toast.textContent = `「${unit.name}」はモックでは設問まで作れません。走れメロス・扇の的・漢詩の風景・文法２ 用言の活用で試してください。`;
    toast.hidden = false;
    return;
  }
  if (tg.checked) state.units.add(u); else state.units.delete(u);
  renderSkel();
});

renderScope();
// 明朝体が読み込まれたら、ページの割り付けをやり直す
if (document.fonts) document.fonts.ready.then(() => { if (state.screen === 'editor') renderPaper(); });
</script>
